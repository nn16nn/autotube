services:
  - type: web
    name: autotube
    runtime: python
    plan: starter            # free жоспар 15 мин бос тұрса ұйықтайды: кезек үзіледі
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false          # мысалы https://autotube.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY   # міндетті емес, тегін кілт (aistudio.google.com)
        sync: false
      - key: GROQ_API_KEY     # міндетті емес, тегін кілт (console.groq.com)
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
